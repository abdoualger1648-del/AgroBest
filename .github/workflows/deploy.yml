name: Déploiement

# Publie l'application sur GitHub Pages.
#
# Prérequis, à faire une seule fois dans les réglages du dépôt :
#   Settings → Pages → Build and deployment → Source = « GitHub Actions ».
# Sans ce réglage, l'étape de déploiement échoue avec une erreur de permission.
#
# L'adresse publique est https://<compte>.github.io/AgroBest/ — c'est elle qui
# impose `base = '/AgroBest/'` au build de production (décision D2).
#
# Le site est publié en édition VITRINE : les trois premières leçons, sans
# compte, et une page de téléchargement de l'APK. Les leçons 4 à 28 n'y sont
# pas seulement masquées, elles ne sont pas construites — `check:bundle` le
# vérifie sur les fichiers produits.
#
# Variable facultative (Settings → Secrets and variables → Actions → Variables) :
#   URL_APK   adresse de téléchargement de l'APK. Sans elle, la page dit
#             simplement qu'aucune version n'est encore publiée.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un seul déploiement à la fois ; une nouvelle version attend la précédente
# au lieu de l'annuler, pour ne jamais laisser Pages sur un build partiel.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Le déploiement refait la vérification complète : rien ne part en
      # production sans que les types, le lint, le contenu et les tests
      # soient passés, même si la CI de la branche a déjà tourné.
      - name: Vérifier
        run: npm run verify

      - name: Build de production (édition vitrine)
        env:
          VITE_EDITION: vitrine
          VITE_URL_APK: ${{ vars.URL_APK }}
        run: npm run build

      - name: Budget de poids, et absence des leçons 4 à 28
        env:
          VITE_EDITION: vitrine
        run: npm run check:bundle

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/agri28/dist

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
