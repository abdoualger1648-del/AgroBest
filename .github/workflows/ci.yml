name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Vérification (types, lint, contenu, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check -w agri28

      - name: Contenu
        run: npm run validate:content

      - name: Tests unitaires
        run: npm run test

      - name: Build de production
        run: npm run build

      - name: Budget de poids
        run: npm run check:bundle

      - name: Tests de bout en bout
        run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/agri28

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/agri28/playwright-report/
          retention-days: 7
